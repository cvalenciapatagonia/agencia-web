<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo — Hero diorama que se transforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--line:#262626;--text:#ededed;--muted:#8a8a8a;--accent:#d6fa50}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
nav{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 48px}
.logo{font-weight:600;letter-spacing:-.02em}.logo i{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:10px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;background:var(--accent);color:#0a0a0a;font-weight:500;font-size:14px;text-decoration:none;border:0;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);margin-left:10px}

.stage{position:relative;height:100vh;min-height:560px;display:grid;grid-template-columns:minmax(0,44%) minmax(0,56%);align-items:center;padding:72px 48px 76px 64px;overflow:hidden}
.stage::before{content:"";position:absolute;right:-10%;bottom:-25%;width:75%;height:80%;background:radial-gradient(ellipse at 50% 50%,rgba(214,250,80,.10),transparent 65%);pointer-events:none}
.copy{position:relative;z-index:2}
h1{font-size:clamp(32px,min(4.6vw,7.4vh),66px);font-weight:500;letter-spacing:-.045em;line-height:1.02;margin:14px 0 14px;max-width:13ch}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:clamp(15px,2.4vh,18px);color:var(--muted);max-width:40ch;font-weight:300}
.ctas{margin:clamp(14px,3vh,28px) 0 clamp(16px,3.4vh,32px)}
.browser{width:min(340px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.bbar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bbar i{width:7px;height:7px;border-radius:50%;background:#3a3a3a}
.bbar .url{margin-left:8px;flex:1;background:#0a0a0a;border-radius:99px;padding:3px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted)}
.bbody{padding:18px 18px 20px}
.bbody h3{font-size:18px;font-weight:500;letter-spacing:-.02em;margin-bottom:12px}
.ln{height:6px;border-radius:3px;background:#2a2a2a;margin-bottom:8px;transform-origin:left}
.ln.s{width:62%}.ln.m{width:88%}
.bbody .btn{margin-top:10px;padding:9px 16px;font-size:12.5px}

.dio{position:relative;z-index:1;height:min(72vh,720px)}
.dio svg{width:100%;height:100%;display:block;overflow:visible}

.chips{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 20px;z-index:3}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.chip:hover{color:var(--text);border-color:#3a3a3a}
.chip.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}

@media(max-width:900px){
  nav{padding:16px 20px}
  .stage{grid-template-columns:1fr;padding:84px 22px 100px;gap:8px}
  .dio{height:46vh;order:-1}
  h1{max-width:none}
  .browser{display:none}
}
</style>
</head>
<body>
<nav><div class="logo"><i></i>Estudio</div><a class="btn" href="#">WhatsApp</a></nav>

<main class="stage">
  <div class="copy">
    <span class="mono" id="eyebrow">// Para clínicas y salud</span>
    <h1 id="title">Tu clínica, con <em>agenda online</em>.</h1>
    <p class="sub" id="sub">Pacientes que reservan hora desde el celular, a cualquier hora.</p>
    <div class="ctas"><a class="btn" href="#">Cotizar por WhatsApp</a><a class="btn ghost" href="#">Ver trabajos</a></div>
    <div class="browser" aria-hidden="true">
      <div class="bbar"><i></i><i></i><i></i><span class="url" id="url">tuclinica.cl</span></div>
      <div class="bbody">
        <h3 id="bh">Reserva tu hora</h3>
        <div class="ln m"></div><div class="ln s"></div><div class="ln m"></div>
        <button class="btn" id="bb" tabindex="-1">Agendar por WhatsApp</button>
      </div>
    </div>
  </div>

  <div class="dio">
    <svg id="svg" viewBox="0 0 1000 570" aria-hidden="true"><g id="world"></g></svg>
  </div>

  <div class="chips" id="chips" role="tablist" aria-label="Rubros"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
// ---------- Datos de cada rubro ----------
const R = [
 {chip:'Clínicas',    name:'CLÍNICA',      eyebrow:'// Para clínicas y salud',          title:'Tu clínica, con <em>agenda online</em>.',               sub:'Pacientes que reservan hora desde el celular, a cualquier hora.', url:'tuclinica.cl',      bh:'Reserva tu hora',        bb:'Agendar por WhatsApp', w:150,d:120,h:120},
 {chip:'Belleza',     name:'SALÓN',        eyebrow:'// Para belleza y bienestar',       title:'Tu salón, siempre con la <em>agenda llena</em>.',       sub:'Reservas, galería de trabajos y promociones en un solo link.',    url:'tusalon.cl',        bh:'Reserva tu cita',        bb:'Reservar ahora',       w:170,d:110,h:82},
 {chip:'Comercio',    name:'FERRETERÍA',   eyebrow:'// Para comercio y retail',         title:'Tu tienda, <em>abierta las 24 horas</em>.',             sub:'Catálogo online y cotizaciones directo a tu WhatsApp.',           url:'tuferreteria.cl',   bh:'Cotiza al instante',     bb:'Cotizar ahora',        w:190,d:130,h:96},
 {chip:'Construcción',name:'CONSTRUCTORA', eyebrow:'// Para construcción y servicios',  title:'Tu constructora, con <em>proyectos que se ven</em>.',   sub:'Portafolio, certificaciones y solicitud de presupuesto en línea.',url:'tuconstructora.cl', bh:'Solicita tu presupuesto',bb:'Pedir presupuesto',    w:120,d:120,h:190},
 {chip:'Gastronomía', name:'RESTAURANTE',  eyebrow:'// Para gastronomía',               title:'Tu restaurante, con <em>mesas reservadas</em>.',        sub:'Carta digital, pedidos y reservas sin intermediarios.',           url:'turestaurante.cl',  bh:'Mira nuestra carta',     bb:'Reservar mesa',        w:170,d:120,h:70},
 {chip:'Educación',   name:'AUTOESCUELA',  eyebrow:'// Para educación y formación',     title:'Tu autoescuela, con <em>alumnos inscritos</em>.',       sub:'Matrículas, horarios y pagos en línea, sin llamadas.',            url:'tuautoescuela.cl',  bh:'Inscríbete hoy',         bb:'Inscribirme',          w:160,d:110,h:100}
];

// ---------- Geometría isométrica ----------
const C=.866, S=.5, CX=500, CY=210, LIME='#d6fa50';
const P=(x,y,z=0)=>[CX+(x-y)*C, CY+(x+y)*S-z];
const pt=a=>a[0].toFixed(1)+','+a[1].toFixed(1);
const poly=(pts,fill,stroke,sw=1)=>`<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
function cube(x,y,w,d,h,z=0,top='#262626',l='#161616',r='#0f0f0f',st='#2e2e2e'){
  return poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],l,st)
       + poly([P(x+w,y+d,z),P(x+w,y,z),P(x+w,y,z+h),P(x+w,y+d,z+h)],r,st)
       + poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top,st);
}
const tree=(x,y)=>cube(x,y,6,6,16)+`<circle cx="${P(x+3,y+3,32)[0]}" cy="${P(x+3,y+3,32)[1]}" r="15" fill="rgba(214,250,80,.14)" stroke="rgba(214,250,80,.55)"/>`;

// Plataforma
const SZ=320, TH=16;
let platform = poly([P(0,SZ,-TH),P(SZ,SZ,-TH),P(SZ,SZ,0),P(0,SZ,0)],'#101010','#262626')
             + poly([P(SZ,SZ,-TH),P(SZ,0,-TH),P(SZ,0,0),P(SZ,SZ,0)],'#0c0c0c','#262626')
             + poly([P(0,0),P(SZ,0),P(SZ,SZ),P(0,SZ)],'#121212','#2a2a2a',1.2);
for(let g=40; g<SZ; g+=40){
  platform += `<line x1="${P(g,0)[0]}" y1="${P(g,0)[1]}" x2="${P(g,SZ)[0]}" y2="${P(g,SZ)[1]}" stroke="#1b1b1b"/>`;
  platform += `<line x1="${P(0,g)[0]}" y1="${P(0,g)[1]}" x2="${P(SZ,g)[0]}" y2="${P(SZ,g)[1]}" stroke="#1b1b1b"/>`;
}

// Props por rubro (siempre delante del edificio)
const propsHTML = [
  tree(250,50)+tree(250,150)+cube(70,205,60,16,10),
  cube(255,50,8,8,56,0,LIME)+tree(250,140)+cube(80,200,40,30,12,0,LIME),
  cube(245,40,30,30,26)+cube(245,80,30,30,26)+cube(248,60,24,24,26,26,LIME)+cube(80,205,50,30,14),
  cube(240,60,10,10,14,0,LIME)+cube(240,100,10,10,14,0,LIME)+cube(240,140,10,10,14,0,LIME)+cube(70,215,60,40,10),
  cube(257,64,6,6,18)+cube(245,58,30,30,5,18,LIME)+cube(257,134,6,6,18)+cube(245,128,30,30,5,18,LIME),
  cube(60,205,60,30,14)+cube(72,210,34,20,12,14,LIME)+tree(250,60)
];

// Edificio (se redibuja en cada fotograma mientras se transforma)
const state={w:50,d:50,h:8,lit:0,name:''};
const BX=30, BY=30;
function faceWindows(len,h,doorZone){
  let s='';
  for(let v=34; v+24<=h-12; v+=36){
    for(let u=12; u+24<=len-12; u+=34){
      if(doorZone && v+24>h-46 && u>len-62) continue;
      s+=`<rect x="${u}" y="${v}" width="24" height="24" rx="2" fill="#0a0a0a" stroke="#2e2e2e"/>`
        +`<rect x="${u}" y="${v}" width="24" height="24" rx="2" fill="rgba(214,250,80,${(state.lit*.32).toFixed(3)})" stroke="rgba(214,250,80,${(state.lit*.7).toFixed(3)})"/>`;
    }
  }
  return s;
}
function building(){
  const {w,d,h,lit,name}=state, x=BX, y=BY;
  // cara izquierda (y = y+d)
  const o1=P(x,y+d,h);
  const left = poly([P(x,y+d,0),P(x+w,y+d,0),P(x+w,y+d,h),P(x,y+d,h)],'#161616','#2e2e2e')
    + `<g transform="matrix(.866 .5 0 1 ${o1[0].toFixed(1)} ${o1[1].toFixed(1)})">`
    + faceWindows(w,h,true)
    + (h>60?`<rect x="${w-50}" y="${h-40}" width="38" height="40" fill="#0a0a0a" stroke="#2e2e2e"/>`:`<rect x="${w-44}" y="${h-30}" width="32" height="30" fill="#0a0a0a" stroke="#2e2e2e"/>`)
    + `<g opacity="${Math.min(1,lit*2).toFixed(2)}"><rect x="6" y="6" width="${Math.max(0,w-12)}" height="18" rx="3" fill="${LIME}"/>`
    + `<text x="${w/2}" y="18.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="500" fill="#0a0a0a">${name}</text></g></g>`;
  // cara derecha (x = x+w)
  const o2=P(x+w,y+d,h);
  const right = poly([P(x+w,y+d,0),P(x+w,y,0),P(x+w,y,h),P(x+w,y+d,h)],'#0f0f0f','#2e2e2e')
    + `<g transform="matrix(.866 -.5 0 1 ${o2[0].toFixed(1)} ${o2[1].toFixed(1)})">` + faceWindows(d,h,false) + `</g>`;
  const top = poly([P(x,y,h),P(x+w,y,h),P(x+w,y+d,h),P(x,y+d,h)],'#232323',`rgba(214,250,80,${(.15+lit*.6).toFixed(2)})`,1.3);
  return left+right+top;
}

// ---------- Montaje ----------
const world=document.getElementById('world');
world.innerHTML = `<g id="plat">${platform}</g><g id="bld"></g>`
  + propsHTML.map((p,i)=>`<g class="prop" id="prop${i}" opacity="0">${p}</g>`).join('')
  + `<g id="bubble" opacity="0"><rect x="770" y="130" width="92" height="34" rx="17" fill="${LIME}"/><path d="M790 163 l8 12 l5-12z" fill="${LIME}"/><text x="816" y="152" text-anchor="middle" font-family="Onest, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a">¡Hola! 👋</text></g>`;
const bld=document.getElementById('bld');
const render=()=>{ bld.innerHTML=building(); };
render();

const chips=document.getElementById('chips');
R.forEach((r,i)=>{ const b=document.createElement('button'); b.className='chip'+(i===0?' on':''); b.textContent=r.chip; b.onclick=()=>goTo(i); chips.appendChild(b); });
const chipEls=[...chips.children];

const $=id=>document.getElementById(id);
const setCopy=i=>{ const r=R[i]; $('eyebrow').textContent=r.eyebrow; $('title').innerHTML=r.title; $('sub').textContent=r.sub; $('url').textContent=r.url; $('bh').textContent=r.bh; $('bb').textContent=r.bb; };
const setActive=i=>chipEls.forEach((c,k)=>c.classList.toggle('on',k===i));

// ---------- Animación ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let master;
function goTo(i){
  if(!master) return;
  master.seek('r'+i,false);   // false = dispara también los callbacks intermedios
  setActive(i); setCopy(i); state.name=R[i].name;
  gsap.set('.prop',{opacity:0}); gsap.set('#prop'+i,{opacity:0});
  master.play();
}

if(reduce){
  const r=R[0]; Object.assign(state,{w:r.w,d:r.d,h:r.h,lit:1,name:r.name}); render(); setCopy(0); gsap.set('#prop0',{opacity:1});
} else {
  gsap.ticker.add(render);
  gsap.to('#world',{y:-8,duration:2.6,ease:'sine.inOut',yoyo:true,repeat:-1});
  const D=4.4, copyEls=['#eyebrow','#title','#sub','.browser'];
  master=gsap.timeline({repeat:-1});
  R.forEach((r,i)=>{
    const T=i*D, prev=(i+R.length-1)%R.length;
    master.addLabel('r'+i,T);
    master.call(setActive,[i],null,T);
    master.to(state,{w:r.w,d:r.d,h:r.h,lit:0,duration:1,ease:'power3.inOut'},T);
    master.call(()=>{state.name=r.name;},null,T+.5);
    master.to('#prop'+prev,{opacity:0,y:14,duration:.4},T);
    master.fromTo('#prop'+i,{opacity:0,y:-16},{opacity:1,y:0,duration:.6,ease:'power2.out'},T+.55);
    master.to(copyEls,{opacity:0,y:-10,duration:.25},T);
    master.call(setCopy,[i],null,T+.27);
    master.to(copyEls,{opacity:1,y:0,duration:.5,stagger:.06},T+.3);
    master.to(state,{lit:1,duration:.9,ease:'power1.out'},T+1.05);
    master.fromTo('.ln',{scaleX:0},{scaleX:1,duration:.5,stagger:.12,ease:'power2.out'},T+1.2);
    master.fromTo('#bubble',{opacity:0,y:10,scale:.7,transformOrigin:'816px 150px'},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(2)'},T+2);
    master.to('#bubble',{opacity:0,duration:.3},T+3.7);
  });
  master.to({}, {duration:.01}, R.length*D);
}
</script>
</body>
</html>
